<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="الحارة: سوق أونلاين محلاته جنب بعض زي الشارع، وكل محل بروح صاحبه.">
<meta property="og:title" content="الحارة">
<meta property="og:description" content="اتمشّى في الحارة: محلات جيرانك جنب بعض، كل محل بروح صاحبه.">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>الحارة</title>
<script>document.documentElement.dir="rtl";document.documentElement.lang="ar";</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Lalezar&family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Changa:wght@500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a night street you walk along (hero), then the life of the neighborhood below; each shop page wears its owner's theme. Deliberate single look. */
:root{
  color-scheme:light;
  --night:#22183f; --dusk:#6b3a6e; --ember:#e98a5d; --glow:#ffcf6a;
  --paper:#f8f2e8; --card:#ffffff; --ink:#261d36; --muted:#7a6f86; --line:#e8dccb;
  --brand:#ff7a45; --brand-ink:#ffffff; --ok:#1fb874; --wa:#25d366;
  --f-display:Lalezar,"Cairo",system-ui,sans-serif;
  --f-body:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;
  --r:18px;
}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{direction:rtl;font-family:var(--f-body);color:var(--ink);font-size:15.5px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:30px;text-decoration:none;color:var(--ink);line-height:1}
.logo .mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--glow),var(--brand) 60%,#d8456b);display:grid;place-items:center;box-shadow:0 6px 16px #ff7a4555}
.logo .mark svg{width:22px;height:22px}
.nav{display:flex;gap:4px;margin-inline-start:auto;align-items:center;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink);font-weight:600;padding:8px 14px;border-radius:999px}
.nav a[aria-current="page"]{background:#261d360d}
.nav a.cta{background:var(--ink);color:#fff;padding:9px 18px}
.nav a.cta:hover{background:#3a2d52}
@media (max-width:640px){.nav a.hide-sm{display:none}.logo{font-size:26px}}

/* hero street */
.hero{position:relative;background:linear-gradient(180deg,var(--night) 0%,#3c2660 38%,var(--dusk) 62%,var(--ember) 88%,#f6b878 100%);color:#fff;overflow:hidden}
.hero canvas.sky{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-block:96px 0}
.hero-head{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,6vw,72px);text-shadow:0 6px 30px #0007}
.hero .sub{opacity:.9;font-size:clamp(15px,1.6vw,19px);max-width:46ch}
.stats{display:flex;gap:10px}
.stat{background:#ffffff14;border:1px solid #ffffff26;border-radius:14px;padding:8px 14px;text-align:center;min-width:86px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{opacity:.8;font-size:12px}
.streets{display:flex;gap:8px;margin-top:22px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.streets::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff38;background:#ffffff10;color:#fff;border-radius:999px;padding:7px 16px;font-weight:600;font-size:14.5px}
.chip:hover{background:#ffffff22}
.chip[aria-pressed="true"]{background:#fff;color:var(--night);border-color:#fff}
.chip .n{opacity:.65;font-size:12px;background:#ffffff1f;border-radius:999px;padding:0 7px}
.plate{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:#1f6f5c;border:3px solid #fff;border-radius:8px;padding:4px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 16px #0004}
.lane{position:relative;margin-top:14px}
.row{display:flex;align-items:flex-end;gap:16px;overflow-x:auto;padding:30px 4px 0;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#ffffff55 transparent}
.sidewalk{height:30px;background:#c9a27c;border-top:4px solid #a77e5a;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.road{height:44px;background:#3a3150;position:relative;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.road::after{content:"";position:absolute;top:20px;inset-inline:0;height:4px;background:repeating-linear-gradient(90deg,#f5d37a 0 40px,transparent 40px 80px)}

/* storefront */
.shop{--wall:#e7a76c;--wall2:#d38c52;--signbg:#fff3df;--signfg:#a2421b;--sfont:var(--f-body);--a1:#e8505b;--a2:#fff3df;--door:#7a3e1d;
  flex:none;width:184px;position:relative;scroll-snap-align:start;border:0;padding:0;background:none;text-align:inherit;color:inherit;transition:transform .25s ease}
.shop:hover{transform:translateY(-6px)}
.shop:hover .sign{box-shadow:0 0 34px var(--signbg)}
.shop .body{border-radius:12px 12px 0 0;overflow:hidden;box-shadow:0 18px 40px #0005}
.shop .upper{height:var(--h,150px);background:var(--wall);padding:14px 12px 0;display:flex;flex-direction:column;gap:12px;align-items:center}
.wins{display:flex;gap:10px}
.wins i{width:32px;height:38px;border-radius:15px 15px 4px 4px;background:#ffe2a8;box-shadow:0 0 16px #ffcf7a;display:block}
.sign{width:100%;padding:7px 6px;border-radius:8px;background:var(--signbg);color:var(--signfg);font-family:var(--sfont);font-size:21px;line-height:1.25;text-align:center;box-shadow:0 0 22px color-mix(in srgb,var(--signbg) 60%,transparent);overflow-wrap:anywhere;transition:box-shadow .25s}
.awn{height:28px;background:repeating-linear-gradient(90deg,var(--a1) 0 22px,var(--a2) 22px 44px);border-radius:0 0 14px 14px;margin:0 -6px;position:relative;z-index:1;box-shadow:0 6px 10px #0003}
.front{height:128px;background:var(--wall2);display:flex;gap:8px;padding:10px 10px 0;margin-top:-6px}
.glass{flex:1;background:linear-gradient(180deg,#fff3d6,#ffd99a);border-radius:6px 6px 0 0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:2px;font-size:24px;padding:6px;box-shadow:inset 0 0 20px #ffb34766}
.door{width:42px;background:var(--door);border-radius:20px 20px 0 0;position:relative}
.door::after{content:"";position:absolute;inset-inline-end:8px;top:55%;width:6px;height:6px;border-radius:50%;background:#ffd36b}
.tagpill{position:absolute;top:-14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.tagpill.new{background:#39d98a;color:#053;box-shadow:0 0 14px #39d98a}
.tagpill.demo{background:#ffffffd9;color:#4b3d63}
.tagpill.mine{background:var(--glow);color:#4a2a00;box-shadow:0 0 14px var(--glow)}
.caption{display:block;text-align:center;color:#fff;font-size:13px;font-weight:600;padding:6px 0 0;opacity:.92}
.shop.empty .body{border:2px dashed #ffffff88;box-shadow:none;background:#ffffff14}
.shop.empty .upper{background:transparent;justify-content:center;color:#fff;font-weight:700;font-size:17px;text-align:center}
.shop.empty .front{background:transparent;align-items:center;justify-content:center;color:#fff;font-weight:700}
.loading-shop{width:184px;height:340px;flex:none;border-radius:12px 12px 0 0;background:linear-gradient(90deg,#ffffff10,#ffffff22,#ffffff10);background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* below the street */
.life{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;padding-block:30px 20px}
@media (max-width:880px){.life{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0}
.panel h2{font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h2 small{font-size:14px;color:var(--muted);font-weight:600}
.post{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line);min-width:0}
.post:last-child{border-bottom:0}
.post .av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;flex:none}
.post .txt{min-width:0;flex:1}
.post .txt small{display:block;color:var(--muted);font-size:13px}
.post button.go{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.friday{background:linear-gradient(140deg,#ff9f43,#ff7a45 45%,#d8456b);color:#fff;border:0;position:relative;overflow:hidden}
.friday h2{font-family:var(--f-display);font-weight:400;font-size:36px}
.count{display:flex;gap:10px;margin:14px 0 18px}
.count div{background:#ffffff2e;border-radius:14px;padding:6px 12px;text-align:center;font-weight:900;font-size:26px;min-width:72px;font-variant-numeric:tabular-nums;line-height:1.3}
.count small{display:block;font-size:12px;font-weight:600;opacity:.9}
.combo{background:#fff;color:var(--ink);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.combo .e{font-size:30px}
.combo .price{margin-inline-start:auto;background:var(--ink);color:#fff;border-radius:999px;padding:5px 14px;font-weight:700;white-space:nowrap}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-block:10px 50px}
@media (max-width:880px){.how{grid-template-columns:1fr 1fr}}
.how .step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.how .step b{font-family:var(--f-display);font-weight:400;font-size:34px;color:var(--brand);line-height:1}
.how .step h3{font-size:17px;margin:6px 0 4px}
.how .step p{color:var(--muted);font-size:14px}
.sec-title{font-family:var(--f-display);font-weight:400;font-size:32px;padding-top:10px}

/* shop page — themed through --t-* */
.shoppage{--t-bg:#fbf1e1;--t-surface:#fff;--t-ink:#4a2a14;--t-muted:#8a6a50;--t-accent:#e8505b;--t-accent-ink:#fff;--t-font:var(--f-body);--t-line:#ecd9bb;
  background:var(--t-bg);color:var(--t-ink);min-height:70vh;padding-bottom:110px}
.shoppage.pat-dots{background-image:radial-gradient(color-mix(in srgb,var(--t-ink) 12%,transparent) 1px,transparent 1px);background-size:16px 16px}
.cover{position:relative;min-height:190px;background:radial-gradient(circle at 50% 120%,color-mix(in srgb,var(--signfg) 35%,transparent),transparent 60%),linear-gradient(160deg,var(--wall),var(--wall2));border-radius:0 0 32px 32px;padding-bottom:58px}
.cover .awn{margin:0;border-radius:0 0 16px 16px;height:34px}
.cover .back{position:absolute;top:50px;inset-inline-start:max(16px,env(safe-area-inset-left,0px));background:#ffffffcc;color:#261d36;border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.avatar{position:absolute;bottom:-46px;left:50%;transform:translateX(-50%);width:96px;height:96px;border-radius:50%;background:var(--t-surface);border:5px solid var(--t-bg);display:grid;place-items:center;font-size:48px;box-shadow:0 10px 24px #0002}
.shead{text-align:center;padding-top:56px;display:flex;flex-direction:column;align-items:center;gap:6px}
.shead h1{font-family:var(--t-font);font-size:clamp(34px,5vw,52px);color:var(--t-accent);overflow-wrap:anywhere}
.shead .tl{color:var(--t-muted);max-width:52ch}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badges span{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:var(--t-surface);border:1px solid var(--t-line)}
.note{max-width:520px;margin:18px auto 0;background:var(--t-surface);border-radius:8px;padding:12px 18px;font-family:var(--t-font);font-size:19px;transform:rotate(-1.2deg);box-shadow:0 6px 14px #0001;border-inline-start:5px solid var(--t-accent);overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:28px}
.item{background:var(--t-surface);border:1px solid var(--t-line);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item .img{aspect-ratio:1/1;max-width:100%;border-radius:14px;background:color-mix(in srgb,var(--t-accent) 10%,var(--t-surface));display:grid;place-items:center;font-size:54px}
.item b{font-size:16px;overflow-wrap:anywhere}
.item .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.item .pr{font-weight:900;color:var(--t-accent);font-variant-numeric:tabular-nums}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:0;background:var(--t-accent);color:var(--t-accent-ink);font-size:19px;font-weight:900;line-height:1;display:grid;place-items:center}
.qty button.minus{background:transparent;color:var(--t-ink);border:1px solid var(--t-line)}
.qty span{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.neigh{margin-top:34px}
.neigh h3{font-family:var(--t-font);font-size:24px;margin-bottom:12px}
.neigh .list{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.ncard{flex:none;width:210px;border-radius:16px;border:1px solid var(--t-line);background:var(--t-surface);padding:12px;display:flex;gap:10px;align-items:center;text-align:start;color:inherit}
.ncard .e{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none}
.ncard small{display:block;color:var(--t-muted);font-size:12.5px}
.cartbar{position:fixed;bottom:0;inset-inline:0;z-index:30;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.cartbar .cb{max-width:720px;margin:0 auto;pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--t-ink);color:var(--t-bg);border-radius:20px;padding:12px 14px 12px 12px;box-shadow:0 14px 40px #0004}
.cartbar .cb .sum{flex:1;font-weight:700;min-width:0}
.cartbar .cb .sum small{display:block;opacity:.75;font-weight:600;font-size:12.5px}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:800;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}
.btn.wa{background:var(--wa);color:#05361a}
.btn.dark{background:var(--ink);color:#fff}
.btn.brand{background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* order sheet */
.sheet{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet .card{background:#fff;color:var(--ink);border-radius:24px;max-width:520px;width:100%;padding:22px;max-height:85vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.sheet h3{font-size:22px;margin-bottom:10px}
.sheet pre{white-space:pre-wrap;background:#f4f0ea;border-radius:12px;padding:12px;font-family:var(--f-body);font-size:14px;margin:10px 0}
.sheet .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* wizard */
.wiz{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;padding-block:30px 60px;align-items:start}
@media (max-width:900px){.wiz{grid-template-columns:1fr}}
.wiz-form{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;min-width:0}
.prog{display:flex;gap:6px;margin-bottom:8px}
.prog i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--brand)}
.wiz .sn{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.wiz h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,3.4vw,38px);margin:4px 0 4px}
.wiz .lead{color:var(--muted);margin-bottom:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-weight:700;font-size:14.5px}
.field small{color:var(--muted);font-size:12.5px}
.in{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:#fffdf9;width:100%}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px #ff7a4522}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600}
.pick[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.emo{display:flex;flex-wrap:wrap;gap:6px}
.emo button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px}
.emo button[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 3px #ff7a4533}
.souls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.souls{grid-template-columns:1fr}}
.soul{border:2px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;padding:0;text-align:start;position:relative}
.soul[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 4px #ff7a4530}
.soul .pv{height:84px;display:grid;place-items:center;font-size:24px;padding:0 10px;text-align:center;overflow:hidden}
.soul .mt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700;font-size:14px}
.soul .sw{display:flex;gap:4px}.soul .sw i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid #0001}
.soul .rec{position:absolute;top:8px;inset-inline-start:8px;background:var(--brand);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px}
.prods{display:flex;flex-direction:column;gap:10px}
.prow{display:grid;grid-template-columns:52px 1fr 110px 36px;gap:8px;align-items:center}
.prow select{font-size:22px;padding:6px 4px;text-align:center}
.prow .del{border:0;background:#f4ece0;border-radius:10px;height:40px;font-size:18px}
@media (max-width:480px){.prow{grid-template-columns:52px 1fr 80px 36px}}
.aibtn{border:1.5px dashed var(--brand);color:#c2501f;background:#fff6f0;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px;align-self:flex-start}
.wnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.msg{border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px}
.msg.err{background:#ffe9e6;color:#9b2a1a}
.msg.info{background:#eef6ff;color:#1d4f86}
.preview{position:sticky;top:90px;background:linear-gradient(180deg,var(--night),var(--dusk) 70%,var(--ember));border-radius:24px;padding:26px 20px 0;color:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center}
.preview .lbl{font-size:13px;opacity:.8;margin-bottom:26px;font-weight:700;letter-spacing:.3px}
.preview .shop{width:210px}
.preview .shop:hover{transform:none}
.preview .walk{height:26px;background:#c9a27c;border-top:4px solid #a77e5a;align-self:stretch;margin:0 -20px}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:64px}
.done h2{font-family:var(--f-display);font-weight:400;font-size:44px;margin:8px 0}
.done .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* photos */
.glass img{width:40px;height:40px;object-fit:cover;border-radius:6px;box-shadow:0 2px 6px #0003}
.cover.has-photo{background-size:cover;background-position:center}
.cover.has-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#0006);border-radius:inherit;pointer-events:none}

.item small.u{color:var(--t-muted);font-size:12.5px;margin-top:-6px}
.qty .pickv,.pickv{width:auto;height:auto;line-height:1.4;border:0;border-radius:999px;background:var(--t-accent);color:var(--t-accent-ink);font-weight:800;font-size:13px;padding:6px 12px}
.psheet .card{padding:0;overflow:hidden;display:flex;flex-direction:column}

.pbody .meta{display:flex;gap:6px;flex-wrap:wrap}.pbody .meta span{font-size:12.5px;font-weight:700;background:#f4f0ea;border-radius:999px;padding:2px 10px}

.stepper{display:flex;align-items:center;gap:12px}

.tips{background:#fff7ec;border:1px solid #f3dcbc;border-radius:14px;padding:10px 14px;font-size:13.5px;color:#7a5530}

.st-pending{background:#fff6dc;border:1px solid #f1dc9c}
.st-active{background:#e6f7ee;border:1px solid #bfe7cf}
.st-bad{background:#ffeceb;border:1px solid #f5c7c2}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14.5px;margin:0}

.minepage{padding-block:30px 60px;display:flex;flex-direction:column;gap:18px;max-width:860px}
.adm{padding-block:30px 60px}
.adm-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}

.adm-sum b{font-size:28px;display:block;font-variant-numeric:tabular-nums;line-height:1.2}
.adm-sum small{color:var(--muted);font-weight:600}
.adm-sum .hot{border-color:#f1c48e;background:#fff6ea}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 14px}
.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.req{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.req .hd{display:flex;gap:12px;align-items:center;min-width:0}
.req .hd .e{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.req .hd div{min-width:0}
.req .hd small{display:block;color:var(--muted);font-size:13px}
.req .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.req .acts .in{flex:1 1 160px;padding:7px 12px}
.btn.sm{padding:7px 14px;font-size:13.5px;border-radius:12px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;color:#b3261e;border:1.5px solid #f0c4c0}
.pill{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.pending{background:#fff1c2;color:#6b4f00}.pill.active{background:#d8f3e3;color:#0f6b3a}.pill.bad{background:#ffe0dd;color:#9b2a1a}.pill.info{background:#e7eefe;color:#1d4f86}
.paym{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.paym span{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;background:color-mix(in srgb,var(--t-accent) 12%,var(--t-surface));border:1px solid var(--t-line)}
.warn{background:#fff4e5;border:1px solid #f3d3a6;color:#7a4b12;border-radius:12px;padding:10px 12px;font-size:13.5px}
.empty-note{color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
/* search, delivery, product manager, share */
.search{margin-top:18px;position:relative;max-width:560px}
.search input{width:100%;border:0;border-radius:999px;padding:13px 48px 13px 18px;font-size:16px;background:#fff;color:var(--ink);box-shadow:0 10px 30px #0004}
.search input:focus{outline:3px solid var(--glow)}
.search span{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.results{margin-top:18px;padding-bottom:26px}
.results h3{font-size:15px;opacity:.85;margin-bottom:10px;font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:10px}
.rcard{display:flex;gap:12px;align-items:center;background:#fff;color:var(--ink);border:0;border-radius:16px;padding:10px;text-align:start;min-width:0}
.rcard .th{width:62px;height:62px;border-radius:12px;background:#f4ece0;display:grid;place-items:center;font-size:28px;overflow:hidden;flex:none}
.rcard .th img{width:100%;height:100%;object-fit:cover}
.rcard div{min-width:0}
.rcard b{display:block;overflow-wrap:anywhere}
.rcard small{display:block;color:var(--muted);font-size:12.5px}
.rcard .pr{color:var(--brand);font-weight:900}
.rnone{background:#ffffff14;border:1px dashed #ffffff55;border-radius:16px;padding:18px;text-align:center}
.ship{max-width:560px;margin:14px auto 0;background:var(--t-surface);border:1px solid var(--t-line);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
.ship .ic{font-size:24px}
.ship small{display:block;color:var(--t-muted)}
.vprices{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.vprices label{display:flex;flex-direction:column;gap:2px;font-size:12.5px;font-weight:700;color:var(--muted)}
.vprices input{padding:7px 10px}
.r2{display:grid;grid-template-columns:1fr 74px;gap:8px}
.r2.np{grid-template-columns:1fr}
.r2 select{font-size:22px;padding:6px 4px}
.pcard>div:first-of-type{padding-inline-end:40px}
.ph .star{position:absolute;bottom:4px;inset-inline-start:4px;border:0;border-radius:999px;background:#000a;color:#fff;font-size:11px;font-weight:800;padding:1px 8px}
.pm{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pmrow{display:grid;grid-template-columns:48px 1fr 92px auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:8px;background:#fffdf9}

.pmrow .th{width:48px;height:48px;border-radius:10px;background:#f4ece0;display:grid;place-items:center;font-size:24px;overflow:hidden}
.pmrow .th img{width:100%;height:100%;object-fit:cover}
.pmrow b{overflow-wrap:anywhere;font-size:14.5px}
.pmrow input.in{padding:6px 8px}
.pmrow .tools{display:flex;gap:4px}
.pmrow .tools button{border:1px solid var(--line);background:#fff;border-radius:10px;height:34px;min-width:34px;font-size:13px;font-weight:700;padding:0 8px}
.pmrow .tools button[aria-pressed="true"]{background:#261d36;color:#fff;border-color:#261d36}
@media (max-width:520px){.pmrow{grid-template-columns:44px 1fr 80px}.pmrow .tools{grid-column:1/-1;justify-content:flex-end}}
.qadd{display:grid;grid-template-columns:1fr 100px auto;gap:8px;margin-top:10px}
@media (max-width:420px){.qadd{grid-template-columns:1fr 80px}.qadd .btn{grid-column:1/-1}}
.share{display:flex;flex-direction:column;gap:10px}
.share .link{background:#f4f0ea;border-radius:12px;padding:10px 12px;font-size:13px;overflow-wrap:anywhere;direction:ltr;text-align:left}
.buyer{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.buyer .in{padding:9px 12px}
.xclose{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:#000b;color:#fff;font-size:16px;display:grid;place-items:center}
.psheet .card{position:relative}

  .hero .wrap{padding-block:72px 0}

.viewas .seg{display:flex;gap:4px}

.viewas.min{padding:6px 10px;cursor:pointer}
.mode-note{background:#fff6dc;border-bottom:1px solid #f1dc9c;color:#6b4f00;font-size:13px;font-weight:700;text-align:center;padding:6px 16px}
.danger{border:1px solid #f5c7c2;background:#fff8f7}
.localnote{background:#e9f7ef;border-bottom:1px solid #bfe7cf;color:#0f5a32;font-size:13px;font-weight:700;text-align:center;padding:6px 16px}
.fb{position:fixed;z-index:34;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline-start:max(12px,env(safe-area-inset-right,0px));background:var(--wa);color:#05361a;border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:800;text-decoration:none;box-shadow:0 8px 20px #0004}

/* ===== Egyptian hara buildings ===== */
.shop{width:196px}
.bld{position:relative;filter:drop-shadow(0 18px 26px #0006)}
.roof{height:24px;position:relative}
.tank{position:absolute;bottom:0;inset-inline-start:20px;width:30px;height:20px;background:linear-gradient(90deg,#24242e,#3a3a48 60%,#24242e);border-radius:5px 5px 0 0}
.tank::before{content:"";position:absolute;bottom:-4px;left:4px;right:4px;height:4px;background:repeating-linear-gradient(90deg,#24242e 0 3px,transparent 3px 8px)}
.dish{position:absolute;bottom:4px;inset-inline-end:24px;width:26px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#f4f4f8,#b9b9c6);transform:rotate(-24deg);box-shadow:0 2px 0 #0003}
.dish::after{content:"";position:absolute;left:11px;top:9px;width:3px;height:12px;background:#9a9aa8;transform:rotate(24deg)}
.upr{background:var(--res);background-image:radial-gradient(#00000012 1px,transparent 1.2px),linear-gradient(180deg,#ffffff14,#0000000d);background-size:7px 7px,100% 100%;border-radius:3px 3px 0 0;padding:14px 12px 4px;position:relative}
.upr::before{content:"";position:absolute;top:0;left:-4px;right:-4px;height:7px;background:color-mix(in srgb,var(--res) 70%,#000);border-radius:2px}
.fl{display:flex;flex-direction:column;gap:6px;padding-bottom:10px}
.fl+.fl{border-top:4px solid color-mix(in srgb,var(--res) 82%,#000);padding-top:10px}
.wins{display:flex;justify-content:space-around;gap:10px}
.w{width:44px;height:52px;border-radius:22px 22px 3px 3px;background:color-mix(in srgb,var(--res) 55%,#3a2a1a);padding:4px 4px 3px;display:flex;gap:2px;position:relative;box-shadow:inset 0 0 0 1px #0002}
.w b{flex:1;border-radius:inherit;display:block}
.w.shish b{background:repeating-linear-gradient(180deg,var(--sh) 0 4px,color-mix(in srgb,var(--sh) 65%,#000) 4px 5.5px)}
.w.shish b:first-child{border-radius:19px 0 2px 2px}.w.shish b:last-child{border-radius:0 19px 2px 2px}
.w.lit{background:#5a3a1e}.w.lit b{background:linear-gradient(180deg,#fff0c4,#ffcf7a);box-shadow:0 0 16px #ffcf7a}
.w.lit b:first-child{border-radius:19px 0 2px 2px}.w.lit b:last-child{border-radius:0 19px 2px 2px}
.w.mash{background:#4a2b16}.w.mash b{background:radial-gradient(circle,#ffd68a 0 1.6px,transparent 2.2px) 0 0/7px 7px,radial-gradient(circle,#ffd68a 0 1.6px,transparent 2.2px) 3.5px 3.5px/7px 7px,#5d361c;box-shadow:0 0 10px #ffb34755}
.w.mash b:first-child{border-radius:19px 0 2px 2px}.w.mash b:last-child{border-radius:0 19px 2px 2px}
.w.ac::after{content:"";position:absolute;bottom:-14px;inset-inline-end:-10px;width:26px;height:14px;background:#e7e7ee;border-radius:2px;box-shadow:inset 0 -3px 0 #c9c9d4,inset 0 0 0 1px #0002}
.balc{height:24px;margin:2px -8px 0;position:relative;border-top:3px solid #2a2a35;background:repeating-linear-gradient(90deg,#2a2a35 0 2px,transparent 2px 8px)}
.balc::after{content:"";position:absolute;bottom:-5px;left:-2px;right:-2px;height:5px;background:color-mix(in srgb,var(--res) 65%,#000);border-radius:1px}
.laundry{position:absolute;top:-24px;left:10px;right:10px;height:2px;border-top:1px solid #0007;display:flex;justify-content:space-around}
.laundry span{width:13px;height:15px;border-radius:2px 2px 4px 4px;margin-top:-1px;transform-origin:top;animation:sway 3.5s ease-in-out infinite;box-shadow:inset 0 -2px 0 #0002}
.laundry span:nth-child(2){animation-delay:-1s;height:18px;width:10px}.laundry span:nth-child(3){animation-delay:-2s;width:16px}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pot{position:absolute;top:-22px;font-size:18px;inset-inline-start:12px}
.pot+.pot{inset-inline-start:auto;inset-inline-end:12px}
.grd{background:linear-gradient(180deg,var(--wall),var(--wall2));padding:10px 9px 0;position:relative}
.grd .sign{width:auto;margin:0;padding:6px 8px;border:3px solid color-mix(in srgb,var(--signfg) 55%,#000);border-radius:5px;box-shadow:0 0 22px color-mix(in srgb,var(--signbg) 55%,transparent),inset 0 0 0 2px color-mix(in srgb,var(--signbg) 70%,#fff);position:relative;font-size:21px}
.grd .sign::before,.grd .sign::after{content:"";position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:color-mix(in srgb,var(--signfg) 40%,#888)}

async function compress(file){
  if(!/^image\//.test(file.type||""))throw{code:"type"};
  if(file.size>25e6)throw{code:"big"};
  let bmp;try{bmp=await createImageBitmap(file)}catch{throw{code:"type"}}
  const sc=Math.min(1,(S.local?900:1400)/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close?.();
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej({code:"type"}),"image/jpeg",S.local?.76:.84));
}

function wizShop(){const w=S.wiz;return{id:S.uid||"preview",name:w.name||"اسم محلك",cat:w.cat,area:w.area,theme:w.theme,avatar:w.avatar,products:w.products.filter(p=>p.n||p.imgs.length).map(p=>({...p,p:Number(p.p)||0})),created:Date.now(),demo:false}}
function renderPreview(){const pv=document.getElementById("pv");if(pv)pv.innerHTML=front(wizShop(),{tag:"div",nopill:true})}
function readWiz(){
  const w=S.wiz;if(!w)return;const v=id=>document.getElementById(id)?.value;const ck=id=>document.getElementById(id)?.checked;
  const num=x=>String(x??"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d.]/g,"");
  if(S.wizStep===0){if(v("w-oname")!=null)w.oname=v("w-oname").trim();if(v("w-name")!=null)w.name=v("w-name").trim();if(v("w-area")!=null)w.area=v("w-area").trim()}
  if(S.wizStep===2){if(v("w-tag")!=null)w.tagline=v("w-tag").trim();if(v("w-note")!=null)w.note=v("w-note").trim();
    w.products.forEach((p,i)=>{if(!document.getElementById("p-n-"+i))return;
      p.n=v("p-n-"+i).trim();p.p=num(v("p-p-"+i));p.e=v("p-e-"+i)||p.e;p.u=(v("p-u-"+i)||"").trim();p.d=(v("p-d-"+i)||"").trim();p.vx=v("p-vx-"+i)||"";const vl=vlist(p),nv={};vl.forEach((x,k)=>{const el=document.getElementById(`p-vp-${i}-${k}`);const n=el?Number(num(el.value)):Number(p.vp?.[x]);if(n>0)nv[x]=n});p.vp=nv;p.mto=!!ck("p-m-"+i);p.out=!!ck("p-o-"+i)})}
  if(S.wizStep===3){if(v("w-wa")!=null)w.wa=v("w-wa").trim();if(v("w-areas")!=null)w.ship.areas=v("w-areas").trim();
    if(v("w-fee")!=null){const f=num(v("w-fee"));w.ship.fee=f===""?null:Number(f)}if(v("w-days")!=null)w.ship.days=v("w-days")}
  if(S.wizStep===4){if(v("w-rref")!=null)w.rref=v("w-rref").trim();if(v("w-months")!=null)w.months=+v("w-months")||1;w.agreed=!!ck("w-agree")}
}
function normWa(x){let d=String(x).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g,"");if(d.startsWith("00"))d=d.slice(2);if(d.length===11&&d.startsWith("01"))d="2"+d;return d}
function wizErr(m){const el=document.getElementById("wmsg");if(el)el.innerHTML=`<div class="msg err" role="alert">${esc(m)}</div>`}
async function wizNext(){
  readWiz();const w=S.wiz,st=S.wizStep,last=nSteps()-1;
  if(st===0&&!w.name)return wizErr("اكتب اسم المحل الأول.");
  if(st===0&&!w.edit&&w.oname.length<5)return wizErr("اكتب اسمك بالكامل.");
  if(Object.values(S.up).some(n=>n>0))return wizErr("استنى الصور تخلص رفع.");
  if(st===2){w.products=w.products.filter(p=>p.n||p.p||p.imgs.length);if(!w.products.length){w.products=[blankProduct(w.cat)];viewOpen();return wizErr("ضيف منتج واحد على الأقل.")}
    if(w.products.some(p=>!p.n||!(Number(p.p)>0))){viewOpen();return wizErr("كل منتج محتاج اسم وسعر أكبر من صفر.")}}
  if(st===3){const raw=String(w.wa).replace(/[٠-٩]/g,c=>"٠١٢٣٤٥٦٧٨٩".indexOf(c)).replace(/\D/g,"");if(raw.startsWith("0")&&!raw.startsWith("00")&&!/^01\d{9}$/.test(raw))return wizErr("رقم الموبايل المصري لازم يبقى ١١ رقم ويبدأ بـ 01، زي: 01012345678");const wa=normWa(w.wa);if(wa.length<10)return wizErr("رقم الواتساب مش مظبوط. اكتبه كده: 01012345678");w.wa=wa;
    if(!w.pay.length)return wizErr("اختار طريقة دفع واحدة على الأقل.")}
  if(st===4){if(w.plan!=="kiosk"&&(S.settings.instapay||S.settings.wallet)){if(!w.rmethod)return wizErr("اختار دفعت بإيه.");if(w.rref.length<3)return wizErr("اكتب رقم العملية عشان صاحب الحارة يطابقه.")}
    if(!w.agreed)return wizErr("لازم توافق على شروط الحارة.")}
  if(st<last){S.wizStep++;viewOpen();window.scrollTo({top:0});return}
  if(!S.db||!S.uid)return wizErr(S.dbState==="pending"?"لسه بنتصل بالحارة، جرّب كمان ثواني.":"الحفظ مش متاح في الطريقة اللي فاتح بيها الصفحة. افتحها من claude.ai وإنت مسجّل دخول.");
  const btn=document.querySelector("[data-wnext]");btn.disabled=true;btn.textContent=w.edit?"بنحفظ…":"بنبعت الطلب…";
  const now=Date.now(),prev=myShop();
  const doc={name:w.name.slice(0,30),oname:(w.oname||"").slice(0,40),cat:w.cat,area:w.area.slice(0,30),avatar:w.avatar,theme:w.theme,tagline:w.tagline.slice(0,90),note:w.note.slice(0,120),wa:w.wa,
    pay:w.pay.filter(k=>PAY[k]),ship:{scope:w.ship.scope,areas:w.ship.areas.slice(0,80),fee:w.ship.fee,days:w.ship.days},cover:w.cover||"",products:w.products.slice(0,12).map(p=>({n:p.n.slice(0,40),p:Number(p.p)||0,e:p.e,imgs:p.imgs.slice(0,4),d:p.d.slice(0,400),u:p.u.slice(0,40),
      v:vlist(p),vp:Object.fromEntries(vlist(p).filter(x=>p.vp?.[x]>0).map(x=>[x,p.vp[x]])),mto:!!p.mto,out:!!p.out})),
    plan:w.edit?(prev?.plan||"shop"):w.plan,
    rent:w.edit?(prev?.rent||null):{plan:w.plan,months:w.plan==="kiosk"?0:w.months,method:w.plan==="kiosk"?"none":(w.rmethod||"none"),ref:w.plan==="kiosk"?"":w.rref.slice(0,40),at:now},
    agreedAt:w.edit?(prev?.agreedAt||now):now,createdAt:prev?.created||now,updatedAt:now};
  try{await S.db.doc("shops/"+S.uid).set(doc);if(!w.edit)track("seller-finished",true);
    if(S.local&&!w.edit){const pl=doc.rent?.plan||"shop";await S.db.doc("approvals/"+S.uid).set({status:"active",plan:pl,paidUntil:pl==="kiosk"?0:now+(doc.rent?.months||1)*30*DAY,reason:"",rentConfirmedAt:now,reviewedAt:now})}
    const c=clean(doc,S.uid);S.real=[c,...S.real.filter(s=>s.id!==S.uid)];S.wizStep=nSteps();viewOpen();
  }catch(e){btn.disabled=false;btn.textContent=w.edit?"احفظ التعديلات":"ابعت طلب التسجيل 📨";
    wizErr(e?.code==="not_granted"?"معندكش صلاحية تفتح محل هنا. اطلب من صاحب الحارة يديك صلاحية المشاركة.":"معرفناش نحفظ دلوقتي. جرّب تاني بعد شوية.")}

let skyRAF=0;
function startSky(){
  cancelAnimationFrame(skyRAF);const cv=document.querySelector("canvas.sky");if(!cv)return;
  const ctx=cv.getContext("2d"),dpr=Math.min(2,devicePixelRatio||1);
  const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr;ctx.scale(dpr,dpr);
  const W=r.width,H=r.height;const stars=Array.from({length:70},(_,i)=>({x:(hash("s"+i)%1000)/1000*W,y:(hash("y"+i)%1000)/1000*H*.45,r:.6+(i%3)*.5,p:i}));
  const sky=[];for(let x=-10;x<W;){const w=38+hash("bw"+x)%64,hh=70+hash("bh"+x)%150;sky.push({x,w,h:hh,ty:hash("bt"+x)%11});x+=w-1}
  const flags=["#e8505b","#ffd166","#06d6a0","#4cc9f0","#ff9f43","#f4f1ea","#c77dff"];
  const lines=[[10,W<640?22:34,0],[W<640?40:54,W<640?20:30,3]];
  const sag=(x,y0,a)=>y0+a*(1-(2*x/W-1)**2);
  const fan=[.18,.42,.66,.88].map(f=>f*W);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const lantern=(x,y,g)=>{ctx.save();ctx.translate(x,y);ctx.strokeStyle="#ffffff66";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,0);ctx.stroke();
    ctx.fillStyle="#3a2a12";ctx.beginPath();ctx.moveTo(-5,0);ctx.lineTo(5,0);ctx.lineTo(7,5);ctx.lineTo(-7,5);ctx.fill();
    ctx.shadowColor="#ffcf6a";ctx.shadowBlur=18*g;ctx.fillStyle=`rgba(255,${190+Math.round(30*g)},90,1)`;ctx.beginPath();ctx.moveTo(-7,5);ctx.lineTo(7,5);ctx.lineTo(5,20);ctx.lineTo(0,25);ctx.lineTo(-5,20);ctx.closePath();ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle="#7a5a1a";ctx.beginPath();ctx.moveTo(0,5);ctx.lineTo(0,23);ctx.moveTo(-6,12);ctx.lineTo(6,12);ctx.stroke();ctx.restore()};
  const draw=t=>{ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{ctx.globalAlpha=.35+.45*Math.abs(Math.sin(t/1400+s.p));ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()});
    ctx.globalAlpha=1;ctx.fillStyle="#ffe9b8";ctx.shadowColor="#ffd98a";ctx.shadowBlur=50;ctx.beginPath();ctx.arc(W*.08,W<640?34:70,W<640?13:32,0,7);ctx.fill();ctx.shadowBlur=0;
    // distant skyline: old roofs, water tanks, domes and minarets
    const base=H-88;ctx.fillStyle="rgba(34,22,62,.62)";
    sky.forEach(b=>{const top=base-b.h;ctx.fillRect(b.x,top,b.w,b.h);
      if(b.ty===0){const mx=b.x+b.w/2;ctx.fillRect(mx-5,top-96,10,96);ctx.fillRect(mx-9,top-64,18,5);ctx.fillRect(mx-7,top-96,14,4);ctx.beginPath();ctx.moveTo(mx-5,top-96);ctx.quadraticCurveTo(mx,top-128,mx+5,top-96);ctx.fill();ctx.fillRect(mx-.8,top-136,1.6,10)}
      else if(b.ty===1){ctx.beginPath();ctx.arc(b.x+b.w/2,top,b.w/2.4,Math.PI,0);ctx.fill();ctx.fillRect(b.x+b.w/2-.8,top-b.w/2.4-10,1.6,10)}
      else if(b.ty<6){ctx.fillRect(b.x+6,top-10,14,10);ctx.fillRect(b.x+b.w-16,top-4,10,4)}
      for(let wy=top+12;wy<base-10;wy+=22)for(let wx=b.x+6;wx<b.x+b.w-8;wx+=14){if(hash("w"+wx+"_"+wy)%5===0){ctx.fillStyle="rgba(255,206,120,.55)";ctx.fillRect(wx,wy,5,7);ctx.fillStyle="rgba(34,22,62,.62)"}}});
    // Ramadan bunting across the alley
    lines.forEach(([y0,a,ph],li)=>{ctx.strokeStyle="#ffffff55";ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x+=6){const y=sag(x,y0,a);x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
      let i=0;for(let x=8;x<W;x+=22,i++){const y=sag(x,y0,a),sw=reduce?0:Math.sin(t/650+i*.7+li)*1.6;ctx.fillStyle=flags[(i+ph)%flags.length];ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.lineTo(x+sw,y+15);ctx.closePath();ctx.fill()}});
    fan.forEach((x,i)=>lantern(x,sag(x,lines[0][0],lines[0][1])+14,.6+.4*Math.abs(Math.sin(t/900+i))));
    if(!reduce)skyRAF=requestAnimationFrame(draw)};
  draw(0);
}
let countT=0;
function tickCount(){
  clearTimeout(countT);const el=document.getElementById("count");if(!el)return;
  const now=new Date(),day=now.getDay();
  if(day===5){el.innerHTML=`<div style="min-width:auto;padding:8px 16px">السوق شغّال دلوقتي 🎉</div>`}
  else{const n=new Date(now);n.setDate(now.getDate()+((5-day+7)%7));n.setHours(0,0,0,0);let s=Math.max(0,(n-now)/1e3|0);
    const d=s/86400|0;s%=86400;const h=s/3600|0;s%=3600;const m=s/60|0;
    el.innerHTML=[[d,"يوم"],[h,"ساعة"],[m,"دقيقة"]].map(([v,l])=>`<div>${fmt(String(v).padStart(2,"0")).replace(/٬/g,"")}<small>${l}</small></div>`).join("")}
  countT=setTimeout(tickCount,30000);
}

/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1)||"street";
  cancelAnimationFrame(skyRAF);document.querySelectorAll(".sheet").forEach(x=>x.remove());
  let v="street";
  if(h.startsWith("shop-")){v="shop";S.curShop=hashShop(h);viewShop(S.curShop)}
  else if(h==="open"){v="open";if(S.lastView!=="open"){S.wiz=null;S.wizStep=S.openAt||0;S.openAt=0}viewOpen()}
  else if(h==="wall"){v="wall";viewWall()}
  else if(h==="mine"){v="mine";if(S.lastView!=="mine"){S.renew=null;S.pm=null;S.delAsk=false}viewMine()}
  else if(h==="admin"){v="admin";viewAdmin()}
  else viewStreet();
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  const no=document.getElementById("navOpen");no.textContent=myShop()?"محلي":"افتح محلك";no.href=myShop()?"#mine":"#open";no.dataset.v=myShop()?"mine":"open";
  if(no.dataset.v===v)no.setAttribute("aria-current","page");
  document.getElementById("navAdmin").hidden=!asOwner();renderViewAs();
  if(v!==S.lastView)window.scrollTo({top:0});
  if(v!==S.lastView){track(v==="shop"?"shop":v);if(v==="open"&&!myShop())trackOnce("seller-started")}
  S.lastView=v;
}
function rerender(){ // refresh live data without losing wizard input
  if(S.lastView==="open")return;
  if(S.lastView==="street"&&document.activeElement?.id==="q"){renderResults();return}
  if(S.lastView==="admin"&&document.activeElement?.closest?.(".adm input"))return;
  if(S.lastView==="mine"&&(S.pm?.dirty||document.activeElement?.closest?.(".minepage input,.minepage select")))return;
  const y=scrollY;const rowX=document.getElementById("row")?.scrollLeft;route();window.scrollTo({top:y});const r=document.getElementById("row");if(r&&rowX!=null)r.scrollLeft=rowX;
}
window.addEventListener("hashchange",route);
let rz=0;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.lastView==="street")startSky()},200)});

/* ---------- events ---------- */
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
app.addEventListener("click",async e=>{
  const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;

  if(d.go){location.hash=d.go;return}

  if(d.pi!=null&&S.lastView==="shop"){const s=findShop(S.curShop);if(s)openProduct(s,+d.pi);return}
  if(d.inc!=null||d.dec!=null){const id=S.curShop,s=findShop(id);if(!s)return;addToCart(s,d.inc??d.dec,"",d.inc!=null?1:-1);
    const y=scrollY;viewShop(id);window.scrollTo({top:y});return}
  if(d.order){const s=findShop(d.order);if(s)openOrder(s);return}
  if(d.copytxt!=null){copyText(d.copytxt);return}
  if(d.tab){S.adminTab=d.tab;viewAdmin();return}
  if(d.ad){b.disabled=true;adminAct(d.ad,d.id);return}
  if(d.ssave!=null){saveSettings();return}
  if(d.sharemine!=null){const m=myShop();if(m)copyText(shopLink(m));return}
  if(d.delask!=null){S.delAsk=true;viewMine();return}
  if(d.delno!=null){S.delAsk=false;viewMine();return}
  if(d.delyes!=null){b.disabled=true;closeShop();return}
  if(d.goprod!=null){S.openAt=2;location.hash="open";return}
  if(S.lastView==="mine"&&S.pm){const L=S.pm.list;
    if(d.pmout!=null){pmRead();L[+d.pmout].out=!L[+d.pmout].out;S.pm.dirty=true;viewMine();return}
    if(d.pmup!=null){pmRead();const k=+d.pmup;if(k>0){[L[k-1],L[k]]=[L[k],L[k-1]];S.pm.dirty=true}viewMine();return}
    if(d.pmdel!=null){pmRead();L.splice(+d.pmdel,1);S.pm.dirty=true;viewMine();return}
    if(d.pmadd!=null){pmRead();const n=(document.getElementById("pm-new-n")?.value||"").trim(),pr=Number(String(document.getElementById("pm-new-p")?.value||"").replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/[^\d.]/g,""));
      if(!n||!(pr>0)){const el=document.getElementById("pmmsg");if(el)el.innerHTML=`<div class="msg err" role="alert">اكتب اسم المنتج وسعره.</div>`;return}
      const s0=myShop();L.push({n:n.slice(0,40),p:pr,e:C(s0?.cat).emo[L.length%10],imgs:[],d:"",u:"",v:[],vp:{},mto:false,out:false});S.pm.dirty=true;viewMine();return}
    if(d.pmsave!=null){b.disabled=true;pmSave();return}}
  if(S.lastView==="mine"&&S.renew){const r=S.renew;r.ref=(document.getElementById("r-ref")?.value||r.ref).trim();r.months=+(document.getElementById("r-months")?.value||r.months);
    if(d.rplan){r.plan=d.rplan;viewMine();return}
    if(d.rmeth){r.method=d.rmeth;viewMine();return}
    if(d.rsend!=null){sendRenew();return}}
  // wizard
  if(!S.wiz)return;const w=S.wiz;
  if(d.cat){readWiz();w.cat=d.cat;if(!w.themeTouched&&!w.edit)w.theme=C(d.cat).soul;
    const vo=C(d.cat).vopts;w.products.forEach(p=>{if(!p.n)p.e=C(d.cat).emo[0];p.vsel=p.vsel.filter(x=>vo.includes(x))});viewOpen();return}
  if(d.av){readWiz();w.avatar=d.av;viewOpen();return}
  if(d.theme){w.theme=d.theme;w.themeTouched=true;viewOpen();return}
  if(d.shipsc){readWiz();w.ship.scope=d.shipsc;viewOpen();return}
  if(d.pay){readWiz();w.pay=w.pay.includes(d.pay)?w.pay.filter(x=>x!==d.pay):[...w.pay,d.pay];viewOpen();return}
  if(d.plan){readWiz();w.plan=d.plan;viewOpen();return}
  if(d.rmethod){readWiz();w.rmethod=d.rmethod;viewOpen();return}
  if(d.vt!=null){readWiz();const p=w.products[+d.vt];const o=d.vo;p.vsel=p.vsel.includes(o)?p.vsel.filter(x=>x!==o):[...p.vsel,o];viewOpen();return}
  if(d.imgdel){readWiz();const [i,k]=d.imgdel.split(":").map(Number);w.products[i]?.imgs.splice(k,1);viewOpen();return}
  if(d.mkmain){readWiz();const [i,k]=d.mkmain.split(":").map(Number);const a=w.products[i]?.imgs;if(a){a.unshift(...a.splice(k,1))}viewOpen();return}
  if(d.coverdel!=null){readWiz();w.cover="";viewOpen();return}
  if(d.padd!=null){readWiz();w.products.push(blankProduct(w.cat,w.products.length));viewOpen();document.getElementById("p-n-"+(w.products.length-1))?.focus();return}
  if(d.pdel!=null){readWiz();w.products.splice(+d.pdel,1);if(!w.products.length)w.products.push(blankProduct(w.cat));viewOpen();return}
  if(d.wback!=null){readWiz();S.wizStep--;viewOpen();return}
  if(d.wnext!=null){wizNext();return}
  if(d.ai!=null){readWiz();if(!S.sample)return;b.disabled=true;b.textContent="بنكتب…";
    try{const items=w.products.filter(p=>p.n).map(p=>p.n).join("، ");
      const {text}=await S.sample(`اكتب جملة تعريفية واحدة قصيرة وجذابة باللهجة المصرية (أقل من 12 كلمة، من غير علامات تنصيص ولا إيموجي) لمحل صغير على الإنترنت.\nاسم المحل: ${w.name}\nبيبيع: ${C(w.cat).label}\nالمنطقة: ${w.area||"غير محددة"}\nالمنتجات: ${items||"غير محددة"}\nالروح: ${T(w.theme).label}\nاكتب الجملة بس.`,{modelTier:"quick"});
      const line=String(text||"").split("\n").map(x=>x.trim()).filter(Boolean)[0]?.replace(/^["«“']|["»”']$/g,"").slice(0,90)||"";
      if(line){w.tagline=line;const i=document.getElementById("w-tag");if(i)i.value=line}
    }catch(err){toast(err?.code==="not_granted"?"الكتابة التلقائية مش متاحة":"معرفناش نكتبها، جرّب تاني")}
    b.disabled=false;b.textContent="✨ اكتبهالي";return}
});
app.addEventListener("input",e=>{
  if(/^pm-p-/.test(e.target.id)&&S.pm){S.pm.dirty=true;const b=document.querySelector("[data-pmsave]");if(b)b.disabled=false;return}
  if(e.target.id==="q"){S.q=e.target.value;renderResults();return}
  if(!S.wiz)return;const id=e.target.id;
  if(id==="w-name"){S.wiz.name=e.target.value.trim();renderPreview()}
  if(id==="w-area"){S.wiz.area=e.target.value.trim();renderPreview()}
  if(/^p-[np]-/.test(id)){readWiz();renderPreview()}
});
app.addEventListener("change",e=>{
  if(/^p-vx-/.test(e.target.id)&&S.wiz){readWiz();viewOpen();return}
  if(e.target.id==="r-months"&&S.renew){S.renew.ref=(document.getElementById("r-ref")?.value||"").trim();S.renew.months=+e.target.value;viewMine();return}
  if(e.target.id==="w-months"&&S.wiz){readWiz();viewOpen();return}
  if(!S.wiz)return;const t=e.target;
  if(t.type==="file"){const files=[...(t.files||[])];
    if(t.id==="w-cover"){uploadFiles(files.slice(0,1),"cover",id=>{S.wiz.cover=id})}
    else if(t.dataset.imgadd!=null){const i=+t.dataset.imgadd,p=S.wiz.products[i];if(!p)return;const room=4-p.imgs.length;if(files.length>room)toast("لحد ٤ صور لكل منتج");
      uploadFiles(files.slice(0,room),"p"+i,id=>{if(p.imgs.length<4)p.imgs.push(id)})}
    return}
  if(/^p-e-/.test(t.id)){readWiz();renderPreview()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelector(".sheet")?.remove()});

document.addEventListener("error",e=>{const im=e.target;if(im?.tagName==="IMG"&&im.dataset.fb!=null){const sp=document.createElement("span");sp.textContent=im.dataset.fb||"🖼️";sp.style.fontSize="inherit";im.replaceWith(sp)}},true);
/* ---------- boot ---------- */
S.cart=LS.get("cart",{});if(!S.cart||typeof S.cart!=="object")S.cart={};
function localDB(){
  let store=LS.get("db",{});if(!store||typeof store!=="object")store={};const subs=new Set();
  const save=()=>{try{localStorage.setItem("alhara.db",JSON.stringify(store))}catch{throw{code:"quota_exceeded"}}};
  const notify=()=>subs.forEach(f=>{try{f()}catch{}});
  const snapC=c=>({docs:Object.keys(store).filter(k=>k.startsWith(c+"/")&&k.split("/").length===2).map(k=>({id:k.slice(c.length+1),exists:true,data:()=>store[k]}))});
  const coll=c=>{const q={orderBy(){return q},limit(){return q},onSnapshot(fn){const f=()=>fn(snapC(c));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}};return q};
  return{collection:coll,doc:p=>({
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));save();notify()},
    update:async d=>{store[p]={...(store[p]||{}),...JSON.parse(JSON.stringify(d))};save();notify()},
    delete:async()=>{delete store[p];save();notify()},
    onSnapshot(fn){const f=()=>fn({exists:!!store[p],data:()=>store[p]});subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}})};
}
const localAssets={async upload(b){
  const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej({code:"type"});r.readAsDataURL(b)});
  const id=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
  try{localStorage.setItem("alhara.img."+id,url)}catch{throw{code:"quota_exceeded"}}return{id,url}}};
function subscribe(db,timer){
  db.collection("approvals").onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=cleanAppr(d.data()));S.appr=m;if(S.loaded)rerender()},()=>{});
  db.doc("settings/main").onSnapshot(d=>{S.settings=cleanSettings(d.exists?d.data():null);if(S.loaded)rerender()},()=>{});
  db.collection("shops").orderBy("updatedAt","desc").limit(200).onSnapshot(snap=>{
    clearTimeout(timer);S.loaded=true;
    S.real=snap.docs.map(d=>clean(d.data(),d.id)).filter(Boolean);rerender();
  },()=>{clearTimeout(timer);S.loaded=true;S.dbState="error";rerender()});
}
function goLocal(timer){
  if(S.local)return;clearTimeout(timer);
  S.local=true;S.isAdmin=false;S.viewAs="";renderViewAs();
  let id=LS.get("localId","");if(!/^local-[0-9a-f]{12}$/.test(id)){id="local-"+[...crypto.getRandomValues(new Uint8Array(6))].map(x=>x.toString(16).padStart(2,"0")).join("");LS.set("localId",id)}
  S.uid=id;S.db=localDB();S.assets=localAssets;S.sample=null;S.dbState="ok";
  const top=document.querySelector(".top");if(top&&!document.getElementById("localnote")){const n=document.createElement("div");n.id="localnote";n.className="localnote";n.textContent="🧪 نسخة تجريبية: جرّب تشتري أو تفتح محل براحتك. اللي بتعمله بيتحفظ على جهازك بس.";top.appendChild(n)}
  subscribe(S.db,timer);
}
if(FEEDBACK_WA){const a=document.createElement("a");a.addEventListener("click",()=>track("feedback-click",true));a.className="fb";a.target="_blank";a.rel="noopener";a.textContent="💬 قولّنا رأيك";
  a.href=`https://wa.me/${FEEDBACK_WA}?text=${encodeURIComponent("رأيي في «الحارة» 🏮\nأنا: (بيّاع / مشتري)\nأكتر حاجة عجبتني:\nأكتر حاجة ضايقتني:\nهستخدمه؟ (آه / لأ / يمكن):\n"+"لو بيّاع، تدفع إيجار كام في الشهر؟:")}`;document.body.appendChild(a)}
route();
(async()=>{
  const cl=window.claude;
  if(!cl?.use){goLocal();return}
  const timer=setTimeout(()=>{if(!S.loaded&&!S.db)goLocal(timer)},10000);
  cl.use("assets").then(a=>{if(S.local)return;S.assets=a;if(S.lastView==="open"&&(S.wizStep===0||S.wizStep===2)){readWiz();viewOpen()}}).catch(()=>{});
  cl.use("sample").then(s=>{if(S.local)return;S.sample=s;if(S.lastView==="open"&&S.wizStep===2)viewOpen()}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([cl.use("db"),cl.use("user")]);
    if(S.local)return;
    if(!db){goLocal(timer);return}
    if(user){try{S.uid=await user.id()}catch{}try{S.isAdmin=!!(await user.canEdit())}catch{}}
    S.viewAs=S.isAdmin?LS.get("viewAs","owner"):"";renderViewAs();
    S.db=db;S.dbState="ok";subscribe(db,timer);
  }catch{goLocal(timer)}
})();
})();
